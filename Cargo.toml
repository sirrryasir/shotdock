[package]
name = "shotdock"
version = "0.1.3"
edition = "2024"
authors = ["Yasir <https://github.com/sirrryasir>"]
description = "Automated window framing, soft drop shadows, and studio screen capture for Wayland"
readme = "README.md"
repository = "https://github.com/sirrryasir/shotdock"
homepage = "https://github.com/sirrryasir/shotdock"
license = "MIT"
keywords = ["wayland", "screenshot", "hyprland", "recording", "gtk4"]
categories = ["command-line-utilities", "gui"]

[dependencies]
chrono = "0.4.45"
gtk4 = "0.11.4"
gtk4-layer-shell = "0.8.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
